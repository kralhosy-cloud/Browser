name: Calyra Android APK

on:
  push:
    branches: [ "arena/eae29342-browser" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: src/calyra-android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          ls -lh src/calyra-android/app/build/outputs/apk/debug/
          sha256sum src/calyra-android/app/build/outputs/apk/debug/*.apk
          cp src/calyra-android/app/build/outputs/apk/debug/app-debug.apk /tmp/Calyra.apk
          cp /tmp/Calyra.apk ./Calyra.apk
          sha256sum ./Calyra.apk > Calyra.apk.sha256
          cat Calyra.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calyra-APK
          path: src/calyra-android/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: Calyra APK ${{ github.run_id }}
          files: |
            ./Calyra.apk
            ./Calyra.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APK to apk branch
        run: |
          git config user.name "calyra-ci"
          git config user.email "ci@calyra.example"
          git fetch origin apk || true
          git checkout -B apk
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp /tmp/Calyra.apk ./Calyra.apk
          cp /tmp/Calyra.apk ./Calyra.apk.sha256 2>/dev/null || sha256sum /tmp/Calyra.apk > Calyra.apk.sha256
          sha256sum ./Calyra.apk > Calyra.apk.sha256
          echo "# Calyra APK modern UI + Discord fix + VPN" > README.md
          echo "Build $GITHUB_SHA $GITHUB_RUN_ID" >> README.md
          cat Calyra.apk.sha256 >> README.md
          git add Calyra.apk Calyra.apk.sha256 README.md
          git commit -m "APK $GITHUB_SHA modern" || true
          git push origin apk --force
