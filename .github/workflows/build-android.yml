name: Calyra Android APK

on:
  push:
    branches: [ "arena/eae29342-browser" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: src/calyra-android
        run: gradle assembleDebug --stacktrace

      - name: Show APK
        run: |
          ls -lh src/calyra-android/app/build/outputs/apk/debug/
          sha256sum src/calyra-android/app/build/outputs/apk/debug/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calyra-APK
          path: src/calyra-android/app/build/outputs/apk/debug/*.apk

      - name: Push APK to apk branch (for E2B fetch)
        run: |
          git config user.name "calyra-ci"
          git config user.email "ci@calyra.example"
          APK=$(ls src/calyra-android/app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK=$APK"
          sha256sum "$APK" | tee Calyra.apk.sha256
          git checkout --orphan apk || git checkout -B apk
          git rm -rf . --ignore-unmatch || true
          cp "$APK" ./Calyra.apk
          cp Calyra.apk.sha256 ./Calyra.apk.sha256 || true
          echo "# Calyra APK" > README.md
          echo "Build from $GITHUB_SHA at $GITHUB_RUN_ID" >> README.md
          cat Calyra.apk.sha256 >> README.md
          git add Calyra.apk Calyra.apk.sha256 README.md || true
          git commit -m "APK $GITHUB_SHA" || true
          git push origin apk --force
