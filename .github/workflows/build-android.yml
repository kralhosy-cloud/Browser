name: Calyra Android APK

on:
  push:
    branches: [ "arena/eae29342-browser" ]
    paths:
      - "src/calyra-android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and platforms
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          yes | sdkmanager --licenses || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (Gradle, no wrapper)
        working-directory: src/calyra-android
        run: |
          gradle assembleDebug --stacktrace --info

      - name: Show APK info
        run: |
          ls -lh src/calyra-android/app/build/outputs/apk/debug/
          sha256sum src/calyra-android/app/build/outputs/apk/debug/app-debug.apk || true
          unzip -l src/calyra-android/app/build/outputs/apk/debug/app-debug.apk | head -n 100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calyra-APK
          path: src/calyra-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
