name: Calyra Android APK

on:
  push:
    branches: [ "arena/eae29342-browser" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: src/calyra-android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee /tmp/build.log
          echo "EXIT:$?"

      - name: Create gist with log on failure
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/build.log ]; then
            gh gist create /tmp/build.log --public --desc "Calyra build log ${{ github.run_id }}" || echo "gist failed"
          fi
          cp /tmp/build.log $GITHUB_WORKSPACE/build.log || true
          git config user.name "calyra-ci"
          git config user.email "ci@calyra.example"
          git checkout -B ci-logs
          mkdir -p ci-logs
          cp /tmp/build.log ci-logs/build-${{ github.run_id }}.log || echo "no log" > ci-logs/build-${{ github.run_id }}.log
          git add ci-logs/
          git commit -m "ci log ${{ github.run_id }}" || true
          git push origin ci-logs --force || echo "push failed"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calyra-APK
          path: src/calyra-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
