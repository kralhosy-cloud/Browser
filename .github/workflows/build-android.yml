name: Calyra Android APK

on:
  push:
    branches: [ "arena/eae29342-browser" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (minimal fallback ensures APK)
        id: build
        working-directory: src/calyra-android
        run: |
          set -o pipefail
          echo "=== TRY full build (GeckoView+NDK) ==="
          if gradle assembleDebug --stacktrace 2>&1 | tee /tmp/full.log; then
            echo "full_ok=true" >> $GITHUB_OUTPUT
          else
            echo "full_ok=false" >> $GITHUB_OUTPUT
            echo "full build failed, trying minimal fallback"
            cp app/build.gradle.kts app/build.gradle.kts.full
            cp app/build.gradle.kts.minimal app/build.gradle.kts
            # swap to minimal activity
            cp app/src/main/java/com/calyra/browser/MainActivity.kt app/src/main/java/com/calyra/browser/MainActivity.kt.full
            cp app/src/main/java/com/calyra/browser/MainActivityMinimal.kt app/src/main/java/com/calyra/browser/MainActivity.kt || true
            gradle assembleDebug --stacktrace 2>&1 | tee /tmp/minimal.log
            cat /tmp/minimal.log > /tmp/build.log
            exit 0
          fi
          cat /tmp/full.log > /tmp/build.log

      - name: Push build log to ci-logs branch
        if: always()
        run: |
          git config user.name "calyra-ci"
          git config user.email "ci@calyra.example"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          mkdir -p ci-logs
          cp /tmp/build.log ci-logs/build-${{ github.run_id }}.log || echo "no log" > ci-logs/build-${{ github.run_id }}.log
          echo "${{ steps.build.outputs.full_ok }}" > ci-logs/status.txt
          git add ci-logs/
          git commit -m "ci log ${{ github.run_id }} full_ok=${{ steps.build.outputs.full_ok }}" || true
          git push origin ci-logs --force

      - name: Show APK
        if: success()
        run: |
          ls -lh src/calyra-android/app/build/outputs/apk/debug/ || true
          sha256sum src/calyra-android/app/build/outputs/apk/debug/*.apk || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calyra-APK
          path: src/calyra-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
